name: Hifz

on:
  push:
    paths:
      - "hifz/**"
      - ".github/workflows/hifz.yml"
  pull_request:
    paths:
      - "hifz/**"
      - ".github/workflows/hifz.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hifz
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      # Parcours complet dans Chromium (gabarit iPhone), y compris hors ligne.
      - name: Test de fumée (Playwright)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
          npm start -- -p 3100 > /tmp/hifz.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3100 && break; sleep 1; done
          node scripts/smoke.mjs http://localhost:3100 "$RUNNER_TEMP/captures" || (tail -50 /tmp/hifz.log; exit 1)
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hifz-captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
