<link rel="stylesheet" href="css/styles.css">

<style>
  /* Écran de démarrage : évite le flash blanc avant le montage de l'app */
  #boot {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center;
    background: #14161A;
    transition: opacity .2s ease;
  }
  :root[data-theme="light"] #boot { background: #F4F5F7; }
  #boot.out { opacity: 0; pointer-events: none; }
  #boot .mark {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(150deg, #F5A623, #E0891A);
    display: grid; place-items: center;
    animation: bootin .4s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes bootin { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>

<div id="boot" aria-hidden="true">
  <div class="mark">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#1A1206"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2M9 4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 12h6M9 16h4"/>
    </svg>
  </div>
</div>

<div id="app"></div>
<div id="toasts"></div>

<noscript>
  <p style="padding:24px;text-align:center">Commande Express a besoin de JavaScript pour fonctionner.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
